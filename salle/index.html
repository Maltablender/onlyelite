<style>

 --f:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,Roboto,sans-serif;--fd:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--t1);font:15px/1.5 var(--f);-webkit-font-smoothing:antialiased}

.step:hover{border-color:var(--l3);transform:translateY(-1px)}.step i{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-style:normal;font-weight:700;background:var(--s3);color:var(--t1)}
.step.done i{background:var(--ok);color:#06140c}.step b{display:block}.step small{color:var(--t3)}.step .go{margin-left:auto;color:var(--t3)}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.in{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--l2);background:var(--bg2);outline:none}.in:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.in.sm{padding:8px 10px;font-size:13.5px;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips label{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:9px;border:1px solid var(--l2);font-size:13px;cursor:pointer;background:var(--bg2)}

.doc{width:100%;height:60vh;border:1px solid var(--l2);border-radius:12px;background:#fff}
.pad{width:100%;height:180px;border:1.5px dashed var(--l3);border-radius:12px;background:#fdfdfc;touch-action:none;display:block}

.task{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--l1);cursor:pointer}.task:last-child{border-bottom:0}
.task input{width:20px;height:20px;accent-color:#3dd68c;flex:none;margin-top:1px}.task.now{background:var(--acs);border-radius:10px;padding:12px 10px}

/* salle d'attente */
.lobby{max-width:1040px;margin:0 auto;padding:22px 18px 40px}

.lhint{position:absolute;left:14px;bottom:14px;display:flex;align-items:center;gap:6px;font-size:12.5px;color:#d8dbe0;text-shadow:0 1px 3px #000}
.lcard{padding:6px 4px}.lcard h1{margin-top:6px}.fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg2 label.f{margin:6px 0}
.lgo{width:100%;margin-top:10px;padding:14px;font-size:16px}

.call{position:fixed;inset:0;display:grid;grid-template-rows:48px 1fr 92px;background:#08090b}
.ctop{display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--l1)}.ctop svg{width:24px;height:24px}.ct{font:600 14.5px var(--fd)}
.cdot{width:8px;height:8px;border-radius:50%;background:var(--wn)}.cdot.ok{background:var(--ok);box-shadow:0 0 0 3px var(--oks)}

.cmain{display:grid;grid-template-columns:1fr 380px;min-height:0}
.stage{position:relative;min-height:0;display:flex}
.grid{flex:1;display:grid;gap:10px;padding:14px;align-content:center;grid-template-columns:1fr;overflow:auto}

.tile{position:relative;border-radius:16px;overflow:hidden;background:var(--s1);aspect-ratio:16/10;border:1px solid var(--l1);transition:box-shadow .12s,border-color .12s;max-height:calc(100vh - 180px);margin:auto;width:100%}
.tile video{width:100%;height:100%;object-fit:cover;display:block;background:#0c0d10}.tile.me video{transform:scaleX(-1)}
.tile .nm{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:8px;background:rgba(0,0,0,.62);font-size:13px;font-weight:500;backdrop-filter:blur(4px)}
.tile .mu{display:grid;color:#ff8f92}.tile .mu svg{width:14px;height:14px}.tile .mu[hidden]{display:none}
.tile .off{position:absolute;inset:0;display:grid;place-items:center;background:var(--s1)}.tile .off span{width:84px;height:84px;border-radius:24px;display:grid;place-items:center;font:600 34px var(--fd);background:var(--s3)}
.tile .off[hidden]{display:none}
.tile.talk{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok),0 0 30px rgba(61,214,140,.35)}
.wait{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--t2);text-align:center;padding:40px}.wait b{color:var(--t1);font-size:16px}.wait span{font-size:13.5px}

.rail{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--l1);background:var(--bg);padding:12px;gap:10px}
.rail .tile{aspect-ratio:16/10;flex:none;margin:0;max-height:none}
.mine{flex:none;border-radius:12px;border:1px solid var(--l1);background:var(--s1);padding:9px 12px;min-height:66px}

.rtabs button.on{background:var(--s3);color:var(--t1)}
.rbody{flex:1;overflow:auto;min-height:0;padding:2px 2px 8px}
.ln{padding:8px 10px;border-radius:10px;margin:0 0 6px;background:var(--s1);border:1px solid var(--l1)}.ln.me{border-color:var(--acl);background:linear-gradient(180deg,var(--acs),var(--s1))}
.ln.live{opacity:.7;border-style:dashed}
.ln .lh{display:flex;justify-content:space-between;font-size:12px;color:var(--t3)}.ln .lh b{color:var(--t1);font-weight:600}.ln.me .lh b{color:var(--ac2)}
.ln p{margin:2px 0 0;font-size:14px}.ln small{display:block;color:var(--t3);font-size:12px;margin-top:2px}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:30px 12px;color:var(--t3);font-size:13px}.empty b{color:var(--t2)}
.plh{font-size:13px;color:var(--t2);margin:2px 0 10px}.plh b{color:var(--t1)}.bar{height:5px;border-radius:5px;background:var(--s3);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.pt{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:10px;cursor:pointer;font-size:14px}.pt:hover{background:var(--s1)}

.notes{min-height:calc(100% - 40px);height:52vh;resize:none;line-height:1.55}
.mst{display:flex;gap:6px;flex-wrap:wrap}

.cbar{display:flex;align-items:center;justify-content:center;gap:10px;padding:0 16px;padding-bottom:env(safe-area-inset-bottom);border-top:1px solid var(--l1);background:var(--bg)}
.cbtn{display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:transparent;cursor:pointer;color:var(--t2);min-width:72px;padding:6px 4px}
.cbtn>span{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--s2);border:1px solid var(--l2);color:var(--t1);transition:background .12s}
.cbtn:hover>span{background:var(--s3)}.cbtn small{font-size:12px;font-weight:600;white-space:nowrap}
.cbtn.off>span{background:rgba(242,85,90,.18);border-color:rgba(242,85,90,.45);color:#ff9a9d}
.cbtn.on>span{border-color:var(--l3)}
.cbtn.end>span{width:auto;padding:0 22px;background:var(--er);border-color:var(--er);color:#fff}.cbtn.end:hover>span{background:#ff6a6f}.cbtn.end small{color:#ffb5b7}

.pop button:hover,.pop a:hover{background:var(--s3)}.pop button:disabled{opacity:.45;cursor:default}.pop b{display:block;font-size:13.5px;font-weight:600}.pop small{display:block;color:var(--t3);font-size:12px}
.pop .danger{background:var(--er);color:#fff;margin-bottom:4px}.pop .danger:hover{background:#ff6a6f}
.pushc{position:fixed;left:50%;top:62px;transform:translateX(-50%);width:min(560px,94vw);z-index:45;padding:16px 18px;border-radius:16px;background:var(--s2);border:1px solid var(--ac);box-shadow:0 24px 60px rgba(0,0,0,.6)}
.pushc h3{margin:10px 0 4px;font:600 22px var(--fd)}.pushc .tag{margin:0}.pushc .btn{margin-top:12px}
.recov{position:fixed;inset:0;z-index:70;background:rgba(5,6,8,.86);overflow:auto;padding:5vh 16px}
.recw{max-width:760px;margin:0 auto;background:var(--s1);border:1px solid var(--l2);border-radius:20px;padding:24px 26px}
.recap h3{margin:22px 0 8px;font:600 15px var(--fd)}.recap ul{margin:0;padding-left:18px;color:var(--t2)}.recap li{margin:4px 0}.recap .rs{font-size:15.5px;line-height:1.65;margin:16px 0 0}

.recap .msg{white-space:pre-wrap;padding:12px 14px;border-radius:12px;background:var(--bg2);border:1px solid var(--l2);margin:0 0 10px;font-size:14px}
.load{display:flex;flex-direction:column;align-items:center;gap:8px;padding:40px;color:var(--t2)}
@media (max-width:900px){.call{grid-template-rows:44px 1fr 84px}.cmain{grid-template-columns:1fr}
 .rail{position:fixed;left:0;right:0;bottom:84px;height:62vh;border-left:0;border-top:1px solid var(--l2);border-radius:18px 18px 0 0;transform:translateY(115%);transition:transform .2s;z-index:30;box-shadow:0 -20px 50px rgba(0,0,0,.5)}
 .rail.open{transform:none}
 .tile.pip{position:absolute;top:10px;right:10px;width:104px;aspect-ratio:3/4;z-index:6;margin:0;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}.tile.pip .nm{display:none}.tile.pip .off span{width:44px;height:44px;font-size:18px;border-radius:12px}
 .cbtn.mob{display:flex}.cbtn{min-width:56px}.cbtn>span{width:46px;height:46px;border-radius:14px}.cbtn small{font-size:11px}.sep{display:none}.grid[data-n="2"]{grid-template-columns:1fr}.tile{aspect-ratio:3/4}
 .cc{bottom:10px}.pushc{top:54px}}
@media (max-width:600px){h1{font-size:27px}.cbtn.end>span{padding:0 14px}}
</style>

function meter(stream, f){ try{ if(!stream.getAudioTracks().length) return ()=>{}; const ac=new (window.AudioContext||window.webkitAudioContext)(), an=ac.createAnalyser(); an.fftSize=1024; ac.createMediaStreamSource(stream).connect(an); const buf=new Float32Array(an.fftSize); let on=true, lv=0;

  const msg=`${HI&&HI.model?(HI.lang==='en'?'Hi '+HI.model+'! Join the call here: ':'Coucou '+HI.model+' ! Rejoins l\'appel ici : '):tr('Rejoins l\'appel : ','Join the call: ')}${lm||lg}`;
  const p=pop(a,`<b class="pt2">${tr('Inviter','Invite')}</b>
   ${lm?`${HI.phone?`<a target="_blank" rel="noopener" href="https://wa.me/${esc(String(HI.phone).replace(/\D/g,''))}?text=${encodeURIComponent(msg)}">${ic('wa')}<span><b>WhatsApp à ${esc(HI.model)}</b><small>${tr('son lien personnel','her personal link')}</small></span></a>`:''}<button data-cp="${esc(lm)}">${ic('copy')}<span><b>${tr('Copier le lien de','Copy link for')} ${esc(HI.model||'')}</b><small>${tr('ouvre aussi son espace','also opens her space')}</small></span></button>`:''}
   <a target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(tr('Rejoins l\'appel : ','Join the call: ')+lg)}">${ic('wa')}<span><b>${tr('WhatsApp à un associé','WhatsApp a partner')}</b><small>${tr('lien invité','guest link')}</small></span></a>
   <button data-cp="${esc(lg)}">${ic('copy')}<span><b>${tr('Copier le lien invité','Copy guest link')}</b><small>${tr('associé, équipe','partner, team')}</small></span></button>`);
  p.querySelectorAll('[data-cp]').forEach(b=>b.onclick=async()=>{ try{ await navigator.clipboard.writeText(b.dataset.cp); toast(tr('Lien copié','Link copied')); }catch(_){ toast(b.dataset.cp); } p.hidden=true; }); }
function popEnd(a){ const p=pop(a,`<b class="pt2">${tr('Terminer l\'appel pour tout le monde ?','End the call for everyone?')}</b><p class="muted" style="margin:0 0 10px;max-width:280px">${tr('Le compte rendu se fait tout seul : engagements de chacun, points de ta trame abordés ou non, message prêt pour','The recap is generated automatically.')} ${esc((HI&&HI.model)||tr('les participants',''))}.</p>
  <button class="danger" id="peGo">${ic('end')}<span><b>${tr('Terminer et faire le compte rendu','End and summarise')}</b></span></button><button id="peLv">${ic('side')}<span><b>${tr('Quitter sans terminer','Leave without ending')}</b><small>${tr('l\'appel reste ouvert','the call stays open')}</small></span></button>`);
  $('#peGo').onclick=()=>{ p.hidden=true; endCall(); }; $('#peLv').onclick=()=>{ p.hidden=true; leave(); }; }
async function onPush(p){ if(!TOK) return; await loadOnb(); $('#rail').classList.add('open');
  if(p.kind==='step'){ STEP_NOW=p.i; const x=(O.tasks||[])[p.i]; if(x){ document.querySelectorAll('.pushc').forEach(z=>z.remove()); const d=document.createElement('div'); d.className='pushc'; d.innerHTML=`<span class="tag">${esc(t('now'))}</span><h3>${esc(x.t)}</h3>${x.d?`<p class="muted" style="margin:0">${esc(x.d)}</p>`:''}<button class="btn sm">OK</button>`; document.body.append(d); d.querySelector('button').onclick=()=>d.remove(); setTimeout(()=>d.remove(),25000); }
    SPV='tasks'; setTab('space'); return; }
  toast(t('push')+' '+({form:t('form'),contract:t('contract'),tasks:t('tasks'),space:t('mySpace')}[p.kind]||''));
  SPV=p.kind==='space'?'tasks':p.kind; setTab('space'); }
let SPV='tasks';
function spaceTabs(){ const T2=$('#spTabs'); if(!T2) return; T2.innerHTML=[['tasks',t('tasks')],['form',t('form')],['contract',t('contract')]].map(([k,l])=>`<button data-sv="${k}" class="${SPV===k?'on':''}">${esc(l)}</button>`).join(''); T2.querySelectorAll('[data-sv]').forEach(b=>b.onclick=()=>{ SPV=b.dataset.sv; spaceTabs(); }); spaceView(SPV); }
async function spaceView(v){ const B=$('#spB'); if(!B) return; if(!O) await loadOnb(); if(!O){ B.innerHTML='—'; return; }
  if(v==='tasks'){ B.innerHTML=`<div id="tkS">${tasksHTML(STEP_NOW)}</div>`; bindTasks($('#tkS'), ()=>spaceView('tasks')); }
  if(v==='form'){ B.innerHTML=`<div id="fmS">${formBody()}<div class="err"></div><button class="btn gold" data-send>${esc(t('send'))}</button></div>`; $('#fmS [data-send]').onclick=()=>submitForm($('#fmS'), ()=>{ SPV='tasks'; spaceTabs(); }); }
  if(v==='contract'){ if(!O.contract){ B.innerHTML=`<p class="muted">${esc(t('noContract'))}</p>`; return; }
    B.innerHTML=`<iframe class="doc" style="height:38vh" sandbox="allow-same-origin" id="docS"></iframe><div id="sgS" style="margin:10px 0 0"></div>`; $('#docS').srcdoc=O.contract;
    const S=$('#sgS'); if(O.signed_at){ S.innerHTML=`<p class="ok">✓ ${esc(t('signed'))} ${new Date(O.signed_at).toLocaleString(L)}</p>`; return; }
    S.innerHTML=`<label class="f"><span>${esc(t('signName'))}</span><input class="in" id="snS"></label><span class="muted">${esc(t('signHere'))}</span><canvas class="pad" id="padS" style="height:150px"></canvas><button class="btn sm" id="pcS" style="margin-top:6px">${esc(t('clear'))}</button><label class="agree"><input type="checkbox" id="agS"> <span>${esc(t('signAgree'))}</span></label><div class="err"></div><button class="btn gold" id="goS">${esc(t('sign'))}</button>`;
    const pad=padInit($('#padS')); $('#pcS').onclick=pad.clear;
    $('#goS').onclick=async()=>{ const er=S.querySelector('.err'); const nm=$('#snS').value.trim(); if(nm.length<3) return er.textContent=t('signName'); if(pad.empty()) return er.textContent=t('signHere'); if(!$('#agS').checked) return er.textContent=t('signAgree');
      $('#goS').disabled=true; try{ await rpc('onb_sign',{t:TOK,p_name:nm,p_img:pad.png(),p_sha:await sha256(O.contract)}); O=await rpc('onb_get',{t:TOK}); toast('✓'); spaceView('contract'); }catch(e){ er.textContent=e.message; $('#goS').disabled=false; } }; } }

/* ---------- fin d'appel et compte rendu ---------- */
function recapHTML(r){ const L2=(t2,a)=>a&&a.length?`<h3>${t2}</h3><ul>${a.map(x=>`<li>${esc(typeof x==='string'?x:[x.qui,x.quoi,x.quand].filter(Boolean).join(' · '))}</li>`).join('')}</ul>`:'';
  const pp=r.points_prevus||[];
  return `<p class="rs">${esc(r.resume||'')}</p>${pp.length?`<h3>Ta trame</h3><ul class="pp">${pp.map(x=>`<li class="${x.aborde?'ok':'no'}">${x.aborde?ic('check'):ic('x')}<span>${esc(x.point)}${x.detail?` <em>· ${esc(x.detail)}</em>`:''}</span></li>`).join('')}</ul>`:''}
   ${L2('Points forts',r.points_forts)}${L2('Tu t\'es engagé à',r.engagements_agence)}${L2('Les autres se sont engagés à',r.engagements_modele)}${L2('Décisions',r.decisions)}${L2('Prochaines étapes',r.prochaines_etapes)}${L2('Points de vigilance',r.points_de_vigilance)}
   ${r.message_modele?`<h3>Message prêt à envoyer</h3><div class="msg" id="rMsg">${esc(r.message_modele)}</div><div class="row">${HI&&HI.phone?`<a class="btn gold" target="_blank" rel="noopener" href="https://wa.me/${esc(String(HI.phone).replace(/\D/g,''))}?text=${encodeURIComponent(r.message_modele)}">${ic('wa')}WhatsApp à ${esc(HI.model)}</a>`:''}<button class="btn" id="rCp">${ic('copy')}Copier</button></div>`:''}
   <p class="muted" style="margin-top:18px">Enregistré dans Only Elite › Appels, avec le script complet.</p>`; }
async function endCall(){ stopRec(); const ov=document.createElement('div'); ov.className='recov'; ov.innerHTML=`<div class="recw"><div class="row" style="justify-content:space-between"><div><p class="eyebrow">${tr('Appel terminé','Call ended')} · ${$('#tmr').textContent}</p><h1 style="margin:4px 0 0">${esc(CI.title||'Compte rendu')}</h1></div><button class="btn sm" id="rcX">${ic('x')}</button></div><div id="rcB" class="recap"><div class="load"><div class="pulse"></div>${tr('Compte rendu en cours… 20 à 60 secondes','Summarising…')}</div></div></div>`; document.body.append(ov);
  ov.querySelector('#rcX').onclick=()=>{ ov.remove(); leave(); };
  try{ await rpc('call_end',{r:ROOM,k:HOST}); bcast('ended',{}); }catch(e){ toast(e.message); }
  PEERS.forEach(p=>p.pc.close()); PEERS.clear(); LS&&LS.getTracks().forEach(x=>x.stop());
  try{ const j=await ai({op:'recap',room:ROOM,key:HOST}); $('#rcB').innerHTML=recapHTML(j.recap); const c=$('#rCp'); if(c) c.onclick=async()=>{ try{ await navigator.clipboard.writeText(j.recap.message_modele); toast('Copié'); }catch(_){ } }; }
  catch(e){ $('#rcB').innerHTML=`<p class="err">${esc(e.message)}</p><p class="muted">Le script reste enregistré : tu pourras refaire le compte rendu depuis Only Elite › Appels.</p>`; } }

(async()=>{ await loadOnb();
  if(ROOM) return lobby();
  if(TOK){ home(); if(sb){ sb.channel('oe-onb-'+TOK).on('broadcast',{event:'push'},async()=>{ await loadOnb(); home(); }).subscribe(); } setInterval(async()=>{ const p=JSON.stringify(O&&O.push); await loadOnb(); if(JSON.stringify(O&&O.push)!==p) home(); },15000); return; }
  app.innerHTML=`<div class="wrap">${brandHTML()}<h1>${esc(t('bad'))}</h1></div>`; })();
</script>
