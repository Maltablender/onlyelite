function padInit(cv){ const ctx=cv.getContext('2d'); const fit=()=>{ const r=cv.getBoundingClientRect(), k=devicePixelRatio||1; cv.width=r.width*k; cv.height=r.height*k; ctx.scale(k,k); ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.strokeStyle='#10204a'; }; fit();

  return `<h3>Résumé</h3><p>${esc(r.resume||'')}</p>${L2('Points forts',r.points_forts)}${L2('L\'agence s\'est engagée à',r.engagements_agence)}${L2('La modèle s\'est engagée à',r.engagements_modele)}${L2('Décisions',r.decisions)}${L2('Prochaines étapes',r.prochaines_etapes)}${L2('Points de vigilance',r.points_de_vigilance)}<p class="muted">Le compte rendu complet, avec la transcription traduite, est enregistré dans Only Elite › Onboarding.</p>`; }
async function endCall(){ const b=$('#hEnd'); b.disabled=true; b.textContent='Compte rendu en cours…';
  try{ await rpc('call_end',{r:ROOM,k:HOST}); bcast('ended',{}); }catch(e){ toast(e.message); }
  try{ const j=await ai({op:'recap',room:ROOM,key:HOST}); $('#recap').innerHTML=recapHTML(j.recap); b.textContent='Compte rendu prêt ✓'; }
  catch(e){ $('#recap').innerHTML=`<p class="err">${esc(e.message)}</p><p class="muted">La transcription reste enregistrée : tu pourras relancer le compte rendu depuis Only Elite.</p>`; b.textContent='Appel terminé'; } }

/* ---------- démarrage ---------- */
(async()=>{ await loadOnb();
  if(ROOM) return lobby();
  if(TOK){ home(); if(sb){ sb.channel('oe-onb-'+TOK).on('broadcast',{event:'push'},async()=>{ await loadOnb(); home(); }).subscribe(); } setInterval(async()=>{ const p=JSON.stringify(O&&O.push); await loadOnb(); if(JSON.stringify(O&&O.push)!==p) home(); },15000); return; }
  app.innerHTML=`<div class="wrap"><div class="brand">Only <b>ELITE</b></div><h1>${esc(t('bad'))}</h1></div>`; })();
</script>
