:root{--bg:#eceae6;--bar:#f4f3f0;--card:#f8f7f5;--white:#fff;--ink:#111;--ink2:#2a2a2a;--mute:#5f5f5f;--dim:#8c8a86;--line:#d9d6d0;--line2:#cbc7c0;--line3:#b5b0a8;
 --blue:#1b3bff;--blue2:#3a56ff;--blues:rgba(27,59,255,.08);--ok:#14864b;--oks:rgba(20,134,75,.1);--wn:#b26a00;--er:#cf2e2e;--talk:#22c55e;
 --disp:"InterD","Inter","Segoe UI",sans-serif;--dispB:"InterB","Inter","Segoe UI",sans-serif;--f:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
button,input,select,textarea{font:inherit;color:inherit}a{color:inherit}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:30px 20px 80px}
.brand{display:flex;align-items:center;gap:10px;font:19px var(--disp);letter-spacing:-.035em;color:var(--ink)}.brand svg{width:26px;height:26px}
h1{font:clamp(44px,9vw,76px)/.95 var(--disp);letter-spacing:-.055em;margin:28px 0 10px}h1 em{font-style:normal}
h3{font:18px var(--dispB);letter-spacing:-.025em;margin:0 0 6px}
.lede{color:var(--mute);margin:0 0 24px;font-size:16.5px}.eyebrow{margin:0;font-size:13px;font-weight:500;color:var(--dim)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px;margin:12px 0}
.step{display:flex;align-items:center;gap:16px;padding:18px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;margin:10px 0;width:100%;text-align:left;transition:border-color .12s}
.step:hover{border-color:var(--ink)}.step i{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:17px var(--disp);font-style:normal;background:var(--white);border:1px solid var(--line2);color:var(--ink)}

  try{ await rpc('call_end',{r:ROOM,k:HOST}); bcast('ended',{}); }catch(e){ toast(e.message); }
  PEERS.forEach(p=>p.pc.close()); PEERS.clear(); LS&&LS.getTracks().forEach(x=>x.stop());
  let recap=null, why='';
  if(CI&&CI.ai){ try{ recap=(await ai({op:'recap',room:ROOM,key:HOST})).recap; }catch(e){ why=e.message; } }
  if(!recap){ recap=localRecap(); }
  $('#rcB').innerHTML=recapHTML(recap)+(why&&!/Aucune parole/.test(why)?`<p class="muted">${esc(why)}</p>`:'');
  const D2=$('#rcDl'); D2.innerHTML=`<button class="btn gold" id="dlS">${ic('doc')}${tr('Télécharger le script','Download transcript')}</button>${LASTVID?`<button class="btn" id="dlV">${ic('rec')}${tr('Retélécharger la vidéo','Download video again')}</button>`:''}`;
  $('#dlS').onclick=()=>downloadScript(recap); const dv=$('#dlV'); if(dv) dv.onclick=()=>dl(LASTVID.blob,LASTVID.name);
  downloadScript(recap);
  const c=$('#rCp'); if(c) c.onclick=async()=>{ try{ await navigator.clipboard.writeText(recap.message_modele); toast(tr('Copié','Copied')); }catch(_){ } }; }

(async()=>{ await loadOnb();
  if(ROOM) return lobby();
  if(TOK){ home(); if(sb){ sb.channel('oe-onb-'+TOK).on('broadcast',{event:'push'},async()=>{ await loadOnb(); home(); }).subscribe(); } setInterval(async()=>{ const p=JSON.stringify(O&&O.push); await loadOnb(); if(JSON.stringify(O&&O.push)!==p) home(); },15000); return; }
  app.innerHTML=`<div class="wrap">${brandHTML()}<h1>${esc(t('bad'))}</h1></div>`; })();
</script>
