<style>
:root{--ink:#050504;--card:#0e0c08;--text:#f4efe4;--muted:#958e80;--dim:#5c574d;--gold:#f2c14e;--gold-hi:#ffe6a6;--line:rgba(242,193,78,.16);--line-2:rgba(242,193,78,.3);--ok:#5fd68a;--warn:#ffa53a;--err:#ff7a66;
  --f-body:Inter,system-ui,sans-serif;--f-display:"Instrument Serif",Georgia,serif;--f-mono:"Geist Mono",ui-monospace,monospace;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 500px at 50% -10%,rgba(242,193,78,.09),transparent),var(--ink);color:var(--text);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}a{color:var(--gold-hi)}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:rgba(255,255,255,.03);color:var(--text);border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;transition:.2s;text-decoration:none}
.btn:hover{border-color:var(--gold)}.btn.gold{background:linear-gradient(180deg,#f7d37a,#d9a53a);color:#1b1305;border-color:transparent;box-shadow:0 8px 24px rgba(242,193,78,.25)}.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}.btn.ghost{background:transparent}.btn:disabled{opacity:.5;cursor:default}
.in{width:100%;background:rgba(0,0,0,.4);border:1px solid var(--line-2);border-radius:12px;padding:11px 13px;outline:none;transition:.2s}.in:focus{border-color:var(--gold)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted)}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 8px}

.me{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:rgba(255,255,255,.03);border-radius:999px;padding:3px 12px 3px 3px;font-size:13px;cursor:pointer;position:relative}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#3a2f18,#14110a);border:1px solid var(--line-2);color:var(--gold-hi);font:italic 15px var(--f-display);flex:none}

.nav{display:flex;gap:6px;padding:6px 0 12px;overflow-x:auto;scrollbar-width:none}.nav button{flex:1;min-width:max-content;display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:rgba(255,255,255,.02);color:var(--muted);border-radius:12px;padding:10px 12px;font-weight:600;font-size:13.5px;cursor:pointer;transition:.2s;position:relative}
.nav svg{width:17px;height:17px}.nav button[aria-pressed=true]{color:var(--gold-hi);border-color:var(--gold);background:rgba(242,193,78,.1)}.nav i{position:absolute;top:-6px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ok);color:#06140b;font:700 10px/18px var(--f-mono);font-style:normal}
h2.t{font:400 30px var(--f-display);margin:8px 0 14px}

.center{min-height:100%;display:grid;place-items:center;padding:24px 16px}

.seg{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:12px;margin-bottom:16px}.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:8px;border-radius:9px;font-weight:600;cursor:pointer}.seg button[aria-pressed=true]{background:rgba(242,193,78,.12);color:var(--gold-hi)}
.stack{display:flex;flex-direction:column;gap:12px}
.gbtn{width:100%;background:#fff;color:#1f1f1f;border-color:#fff;gap:10px}.gbtn:hover{background:#f3f3f3;border-color:#f3f3f3}

.pw{position:relative;display:block}.pw .in{padding-right:46px}.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;border-radius:8px}.eye:hover{color:var(--gold-hi)}.eye svg{width:19px;height:19px}
.alt{text-align:center;margin-top:14px;font-size:13.5px;color:var(--muted)}.alt button{border:0;background:none;color:var(--gold-hi);font-weight:600;cursor:pointer;padding:2px}
.in.code::placeholder{letter-spacing:.2em;opacity:.35}
.in.code{text-align:center;font:600 24px var(--f-mono);letter-spacing:.35em}

.fth{position:relative;aspect-ratio:16/9;background:#0b0a07 center/cover no-repeat;display:grid;place-items:center;border-bottom:1px solid var(--line)}.fth em{font-style:normal;font-size:30px;opacity:.85}.fth i{position:absolute;left:10px;top:10px;font:600 10px var(--f-mono);font-style:normal;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.65);color:var(--gold-hi);border:1px solid var(--line-2)}

.fbd{padding:14px 16px;display:flex;flex-direction:column;gap:5px}.fbd b{font-size:17px}.fbd small{color:var(--muted);font-size:13px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.modal>div.player{max-width:min(1280px,96vw);max-height:96vh;width:96vw}
.player{width:100%;max-width:960px;background:linear-gradient(180deg,#15120c,#0b0a07);border:1px solid var(--line-2);border-radius:18px;padding:14px}.pl-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}.pl-h b{flex:1;font-size:16px}
.pl-v{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}.pl-v.doc{aspect-ratio:auto;height:80vh}.pl-v.soon{background:#0b0a07 center/cover;display:grid;place-items:center}.pl-v.soon span{background:rgba(0,0,0,.75);padding:12px 18px;border-radius:999px;border:1px solid var(--line-2);color:var(--gold-hi);font-weight:600}.pl-v iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ph{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:10px 0 18px}.pt b{display:block;font:400 30px var(--f-display)}.pt small{color:var(--muted);font-size:13px}
.pctl{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pbtn{border:1px solid var(--line-2);background:transparent;color:var(--text);border-radius:10px;padding:9px 14px;font-weight:600;font-size:13px;cursor:pointer}.pbtn:hover{border-color:var(--gold)}
.psearch{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:0 12px;color:var(--muted)}.psearch input{background:none;border:0;outline:none;color:var(--text);padding:9px 0;width:200px}
.pview{display:flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}.pview button{border:0;background:transparent;color:var(--muted);padding:8px 13px;cursor:pointer;font-size:15px}.pview button[aria-pressed=true]{background:rgba(255,255,255,.12);color:var(--text)}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px 22px}.pgrid.vlist{grid-template-columns:1fr;gap:14px}
.pc{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:10px;text-align:left;font:inherit;padding:0;border:0;background:none;color:var(--text);cursor:pointer}.pc.vlist{flex-direction:row;align-items:flex-start;gap:16px}.pc.vlist .pth{width:300px;flex:none}
.pth{position:relative;aspect-ratio:16/9;border-radius:10px;background:#16130d center/cover no-repeat;border:1px solid rgba(255,255,255,.08);display:grid;place-items:center;overflow:hidden;transition:.25s}.pth em{font-style:normal;font-size:30px;opacity:.7}.pc:hover .pth{transform:translateY(-2px);box-shadow:0 14px 34px rgba(0,0,0,.55);border-color:var(--line-2)}
.pb{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:5px;padding:3px 8px;border-radius:6px;background:rgba(0,0,0,.72);color:#fff;font:600 12px var(--f-body)}
.pp{position:absolute;right:10px;bottom:10px;width:42px;height:42px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.4);transition:.2s}.pp svg{margin-left:2px}.pc:hover .pp{transform:scale(1.08)}
.plogo{font:italic 400 22px var(--f-display);color:var(--text);opacity:.55}.plogo b{font:600 10px var(--f-mono);letter-spacing:.25em;color:var(--gold);font-style:normal}
.pbd{display:flex;flex-direction:column;gap:4px}.pbd b{font-size:15.5px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.pbd small{color:var(--muted);font-size:13.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.pbd i{font-style:normal;color:var(--dim);font-size:13px}
@media (max-width:900px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.psearch input{width:140px}}@media (max-width:560px){.pgrid{grid-template-columns:1fr}.pc.vlist{flex-direction:column}.pc.vlist .pth{width:100%}.pctl{margin-left:0;width:100%}.pbtn{flex:1}}
.note{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);font-size:13.5px;color:var(--muted)}.note.ok{border-color:rgba(95,214,138,.4);color:#b9f0c6}.note.err{border-color:rgba(255,122,102,.45);color:#ffc2b8}
/* chat */
.chat{display:flex;flex-direction:column;height:calc(100dvh - 150px);min-height:380px;border:1px solid var(--line-2);border-radius:18px;background:linear-gradient(180deg,#15120c,#0b0a07);overflow:hidden}
.chat-h{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);position:relative}

.chlist{position:absolute;left:12px;top:calc(100% + 4px);background:var(--card);border:1px solid var(--line-2);border-radius:12px;padding:6px;min-width:240px;z-index:10;box-shadow:0 14px 40px rgba(0,0,0,.6)}.chlist button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:9px 10px;border-radius:8px;text-align:left;cursor:pointer}.chlist button:hover,.chlist button[aria-pressed=true]{background:rgba(242,193,78,.1);color:var(--gold-hi)}.chlist span{flex:1}.chlist i{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--ok);color:#06140b;font:700 10px/18px var(--f-mono);font-style:normal;text-align:center}
.live{margin-left:auto;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}.live b{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.msgs{flex:1;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.day{align-self:center;margin:10px 0 6px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.05);color:var(--muted);font:500 10.5px var(--f-mono);text-transform:capitalize}
.m{display:flex;align-items:flex-end;gap:7px;margin-top:6px;max-width:88%}.m.cont{margin-top:2px}.m.mine{align-self:flex-end;flex-direction:row-reverse}.m .av{width:26px;height:26px;font-size:12px}.m.cont .av,.m.mine .av{visibility:hidden}.m.mine .av{display:none}
.b{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:6px 10px 5px}.m.mine .b{background:linear-gradient(180deg,rgba(242,193,78,.2),rgba(242,193,78,.1));border-color:rgba(242,193,78,.35);border-radius:14px 14px 4px 14px}.m.boss .b{border-color:rgba(242,193,78,.5)}
.b b{display:block;font-size:11.5px;color:var(--gold-hi)}.b p{margin:0;white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.4}.b small{display:block;text-align:right;font-size:10px;color:var(--muted);margin-top:2px}
.compose{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;border-top:1px solid var(--line)}.compose textarea{flex:1;resize:none;max-height:140px}
.mst{white-space:nowrap}.mst.lu{color:#5fd68a;font-weight:600}.mst.err{color:#ff8f7a}
.mprog{display:block;height:3px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:4px}.mprog u{display:block;height:100%;width:0;background:linear-gradient(90deg,#c9962e,#ffe08a);transition:width .25s}.mprog.err u{background:#ff7a66}

.ch-hero{position:relative;overflow:hidden;border-radius:26px;padding:22px 24px;margin:2px 0 16px;background:radial-gradient(120% 140% at 0% 0%,rgba(233,196,106,.22),transparent 55%),radial-gradient(90% 120% at 100% 100%,rgba(255,150,190,.16),transparent 60%),linear-gradient(135deg,rgba(22,17,10,.94),rgba(9,8,6,.95));border:1px solid rgba(233,196,106,.32);box-shadow:0 24px 60px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06);display:flex;align-items:center;gap:22px;flex-wrap:wrap;animation:chIn .7s cubic-bezier(.2,1.1,.3,1) both}
.ch-hero h2{margin:0;font:500 clamp(26px,4vw,38px)/1.15 var(--serif,'Bodoni Moda',serif);padding-bottom:3px}.ch-hero h2 em{font-style:italic;background:linear-gradient(180deg,#fff1c8,#e9c46a 50%,#c99a3a);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:4px}
.ch-hero p{margin:6px 0 0;color:var(--muted);font-size:14px}.ch-ht{flex:1;min-width:220px}
.ch-ring{--p:0;position:relative;width:96px;height:96px;border-radius:50%;flex:none;background:conic-gradient(#e9c46a calc(var(--p)*1%),rgba(255,255,255,.08) 0);display:grid;place-items:center}
.ch-ring::before{content:"";position:absolute;inset:8px;border-radius:50%;background:#0d0b08}.ch-ring span{position:relative;text-align:center;line-height:1}.ch-ring b{display:block;font:600 26px var(--serif,'Bodoni Moda',serif);color:#fff1c8}.ch-ring small{font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
@property --p{syntax:'<number>';inherits:false;initial-value:0}@keyframes ringIn{from{--p:0}}
.ch-pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.ch-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font:600 12.5px inherit;background:rgba(var(--c),.12);border:1px solid rgba(var(--c),.35);color:rgb(var(--c))}
.ch-spark{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffe9a8;box-shadow:0 0 10px #ffd36b;opacity:0;animation:spk 4s ease-in-out infinite}@keyframes spk{0%,100%{opacity:0;transform:translateY(8px) scale(.5)}50%{opacity:1;transform:translateY(-8px) scale(1)}}
.ch-g{display:grid;grid-template-columns:1fr;gap:16px}@media (min-width:640px){.ch-g{grid-template-columns:repeat(3,1fr)}}@media (min-width:640px) and (max-width:900px){.ch-c .fr{width:62px}.ch-c.photo .fr{width:70px;height:88px}.ch-c.story .fr{width:78px}.fr.f1{transform:translateX(-46px) rotate(-12deg) translateY(10px)}.fr.f3{transform:translateX(46px) rotate(12deg) translateY(10px)}}
.ch-c{--rx:0deg;--ry:0deg;position:relative;overflow:hidden;isolation:isolate;text-align:left;border-radius:26px;padding:0;border:1px solid rgba(var(--c),.4);background:radial-gradient(130% 90% at 50% 0%,rgba(var(--c),.30),transparent 62%),linear-gradient(180deg,rgba(20,16,11,.95),rgba(8,7,5,.97));color:var(--text);font:inherit;cursor:pointer;display:flex;flex-direction:column;min-height:330px;box-shadow:0 18px 44px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.07);transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry));animation:chIn .8s cubic-bezier(.2,1.1,.3,1) both;animation-delay:calc(var(--i)*110ms);transition:transform .25s ease-out,box-shadow .35s,border-color .35s}
button.ch-c:hover{box-shadow:0 28px 70px rgba(0,0,0,.5),0 0 0 1px rgba(var(--c),.6),0 0 60px rgba(var(--c),.28);border-color:rgba(var(--c),.8)}
button.ch-c:active{transform:perspective(900px) scale(.98)}
button.ch-c:focus-visible{outline:2px solid rgb(var(--c));outline-offset:3px}
@keyframes chIn{from{opacity:0;transform:translateY(26px) scale(.95)}}
.ch-c::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.16) 48%,transparent 60%);transform:translateX(-120%);transition:transform .9s cubic-bezier(.2,.8,.2,1)}button.ch-c:hover::after{transform:translateX(120%)}

.ring b{width:68px;height:68px;border-radius:50%;background:#0b0905;display:grid;place-items:center;font:700 20px var(--f-mono);color:var(--gold-hi)}.ring.full b{color:var(--ok)}
.day-h h2{margin:0;font:600 24px var(--f-display);color:var(--gold-hi)}.day-h p{margin:4px 0 0;color:var(--muted);font-size:13.5px}.day-h .msg{color:var(--text);font-weight:600}
.day-h .row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}.chipx{font:600 11.5px var(--f-mono);padding:5px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--gold-hi)}.chipx.g{border-color:rgba(95,214,138,.5);color:var(--ok)}
.ntb{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px;padding:14px 16px;border-radius:16px;border:1px solid var(--line-2);background:linear-gradient(135deg,rgba(242,193,78,.1),rgba(242,193,78,.02));}
.ntb img{width:42px;height:42px;border-radius:11px;flex:none;box-shadow:0 0 18px rgba(242,193,78,.25)}.ntb div{flex:1;min-width:200px}.ntb b{display:block;font-size:14.5px;color:var(--gold-hi);margin-bottom:2px}.ntb span{font-size:12.5px;color:var(--muted);line-height:1.45}
.top .tr{display:flex;align-items:center;gap:8px}.nbell{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(242,193,78,.55);background:linear-gradient(135deg,rgba(242,193,78,.22),rgba(242,193,78,.06));color:var(--gold-hi);border-radius:999px;padding:8px 13px;font:600 13px/1 inherit;font-family:inherit;cursor:pointer;white-space:nowrap;animation:nbP 2.4s ease-in-out infinite}.nbell.on{animation:none;border-color:var(--line-2);background:rgba(255,255,255,.04);color:var(--text)}@keyframes nbP{0%,100%{box-shadow:0 0 0 0 rgba(242,193,78,.45)}50%{box-shadow:0 0 0 7px rgba(242,193,78,0)}}@media(max-width:520px){.nbell.on span{display:none}.nbell{padding:8px 10px;font-size:11.5px;gap:5px}.top .me>span:not(.av){display:none}}
.ntb ol{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--text);line-height:1.6}
.vbtn{margin-left:auto}.vst{font-size:12px;color:var(--muted);width:100%}
.tl{display:flex;flex-direction:column;gap:8px}.tk{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.3);border-left:4px solid var(--c,var(--gold));transition:.2s;width:100%}
.tk:hover{border-color:var(--c,var(--gold));background:rgba(255,255,255,.03)}.tk .bx{width:22px;height:22px;border-radius:7px;border:2px solid var(--c,var(--gold));flex:none;margin-top:1px;display:grid;place-items:center;font-size:13px;color:#0b0905}
.tk .tx{flex:1;min-width:0}.tk .tx b{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:3px}.tk .tx span{font-size:14.5px;line-height:1.4;color:var(--text)}
.tk.ig{--c:#ff8a3d}.tk.x{--c:#1d9bf0}.tk.tt{--c:#ff2d6f}.tk.sc{--c:#ffd400}.tk.fb{--c:#7c5cff}.tk.yt{--c:#ff2b2b}
.tk.done{--c:var(--ok);background:rgba(95,214,138,.08);border-color:rgba(95,214,138,.35)}.tk.done .bx{background:var(--ok);border-color:var(--ok)}.tk.done .tx span{color:#bfeccc;text-decoration:line-through;text-decoration-color:rgba(95,214,138,.5)}
.tk.gone{transition:max-height .5s cubic-bezier(.4,0,.2,1),opacity .4s ease,padding .5s ease,margin .5s ease,border-width .5s ease,transform .5s ease;max-height:0!important;opacity:0;padding-top:0!important;padding-bottom:0!important;margin-bottom:-8px!important;border-width:0!important;transform:translateX(30px) scale(.97);overflow:hidden}
.ppx{position:fixed;left:0;top:0;pointer-events:none;z-index:99999;border-radius:2px;will-change:transform,opacity}
.dtog{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;width:100%;margin:16px 0 10px;padding:12px 14px 12px 12px;border-radius:18px;background:linear-gradient(135deg,rgba(32,64,44,.92),rgba(12,22,16,.94));border:1px solid rgba(110,231,160,.38);box-shadow:0 12px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.07);color:#eafff1;transition:transform .25s cubic-bezier(.2,1.4,.4,1),box-shadow .25s,border-color .25s;-webkit-tap-highlight-color:transparent}
.dtog:hover{transform:translateY(-2px);border-color:rgba(110,231,160,.7);box-shadow:0 18px 40px rgba(0,0,0,.42),0 0 28px rgba(110,231,160,.18)}.dtog:active{transform:scale(.98)}
.dtog:focus-visible{outline:2px solid #6ee7a0;outline-offset:3px}
.dt-i{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:800 18px inherit;color:#06240f;background:linear-gradient(180deg,#b8f5cf,#4fd487);box-shadow:0 6px 16px rgba(79,212,135,.4)}
.dt-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.dt-t b{font:700 15px inherit;color:#eafff1}.dt-t small{font-size:12.5px;color:#9fd8b4}
.dt-a{flex:none;display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;font:700 13px inherit;color:#06240f;background:linear-gradient(180deg,#d6fbe4,#6ee7a0);box-shadow:0 6px 16px rgba(110,231,160,.3)}
.dt-a svg{transition:transform .35s cubic-bezier(.2,1.4,.4,1)}.dtog.on .dt-a svg{transform:rotate(180deg)}.dtog:hover .dt-a{filter:brightness(1.06)}
.perf{text-align:center;padding:28px 16px;border-radius:16px;border:1px solid rgba(95,214,138,.4);background:rgba(95,214,138,.07);margin-top:14px}.perf b{display:block;font-size:20px;color:#c9f7d4;margin-bottom:4px}.perf span{color:#a59e8f;font-size:13.5px}
.tk.pop{animation:tkpop .45s ease}@keyframes tkpop{0%{transform:scale(1)}40%{transform:scale(1.025)}100%{transform:scale(1)}}
.dsec{font:600 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:20px 0 8px;display:flex;align-items:center;gap:8px}.dsec.g{color:var(--ok)}
.acc header .pfi{margin-left:0}
.conf{position:fixed;inset:0;pointer-events:none;z-index:99}.conf i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:cf 1.6s ease-in forwards}@keyframes cf{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}
.pfb{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;margin-right:2px;letter-spacing:.02em}.pfb.ig{background:linear-gradient(45deg,#f9a03f,#e1306c,#833ab4);color:#fff}.pfb.x{background:#000;color:#fff;border:1px solid #444}.pfb.tt{background:#000;color:#69f0e8;border:1px solid #444}.pfb.yt{background:#ff0033;color:#fff}.pfb.fb{background:#1877f2;color:#fff}.pfb.sc{background:#fffc00;color:#111}
/* ===== Habillage « ciel vivant » : verre fumé noir & or par-dessus le décor ===== */
html,body{background:#050504}body{background:transparent!important}
.oe-sky{position:fixed;inset:0;width:100vw;height:100vh;z-index:-1;pointer-events:none;display:block}
/* ===== gamification ===== */
.oe-xp{position:fixed;z-index:99999;pointer-events:none;font:800 16px var(--f-mono,monospace);color:#ffe6a6;text-shadow:0 0 12px rgba(242,193,78,.9),0 2px 6px rgba(0,0,0,.8);animation:oeXp 1.4s cubic-bezier(.2,.8,.2,1) forwards}@keyframes oeXp{0%{opacity:0;transform:translateY(6px) scale(.8)}15%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-46px) scale(1)}}
.oe-lvl{position:fixed;inset:0;z-index:99998;display:grid;place-items:center;background:radial-gradient(circle,rgba(242,193,78,.18),rgba(0,0,0,.7) 60%);backdrop-filter:blur(4px);animation:oeIn .4s ease-out}.oe-lvl.out{opacity:0;transition:.5s}
.oe-lvl>div{text-align:center;padding:30px 34px;border-radius:24px;border:1px solid rgba(242,193,78,.55);background:linear-gradient(180deg,rgba(26,21,12,.95),rgba(10,8,5,.95));box-shadow:0 0 60px rgba(242,193,78,.35);animation:oePop .6s cubic-bezier(.2,1.5,.4,1)}
.oe-lvl span{display:block;font-size:56px;filter:drop-shadow(0 0 20px rgba(242,193,78,.7))}.oe-lvl b{display:block;margin-top:8px;font:400 30px var(--f-display,Georgia,serif);color:#fff3cc}.oe-lvl small{display:block;margin-top:4px;color:#c9bfa6;font-size:14px}
@keyframes oeIn{from{opacity:0}}@keyframes oePop{from{transform:scale(.6);opacity:0}}

/* ===== couvertures de formation ===== */
.oe-cov{--cc:#f2c14e;--c2:#8a6212;position:absolute;inset:0;display:block;overflow:hidden;border-radius:inherit;background:radial-gradient(120% 90% at 18% 20%,color-mix(in srgb,var(--cc) 30%,transparent),transparent 55%),radial-gradient(90% 80% at 100% 100%,color-mix(in srgb,var(--c2) 35%,transparent),transparent 60%),linear-gradient(160deg,#16120b,#070605);isolation:isolate}
.oe-cov::before{content:"";position:absolute;inset:7px;border-radius:12px;border:1px solid rgba(242,193,78,.28);pointer-events:none}
.oe-cov .oc-g{position:absolute;inset:-30%;background:conic-gradient(from 0deg,transparent,color-mix(in srgb,var(--cc) 18%,transparent),transparent 40%);animation:ocSpin 14s linear infinite;opacity:.8}
@keyframes ocSpin{to{transform:rotate(360deg)}}
.oe-cov .oc-sh{position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,240,200,.14) 50%,transparent 65%);transform:translateX(-120%);transition:transform .9s ease}
:hover>.oe-cov .oc-sh,:hover>*>.oe-cov .oc-sh{transform:translateX(120%)}
.oc-lab{position:absolute;left:16px;top:14px;font:600 9.5px var(--f-mono,monospace);letter-spacing:.2em;text-transform:uppercase;color:#f2c14e}
.oc-ic{position:absolute;right:16px;top:12px;width:44px;height:44px;color:var(--cc);filter:drop-shadow(0 0 14px color-mix(in srgb,var(--cc) 70%,transparent))}.oc-ic svg{width:100%;height:100%}
.oc-t{position:absolute;left:16px;right:16px;bottom:16px;font:400 clamp(17px,2.2vw,22px)/1.15 var(--f-display,Georgia,serif);color:#fff6dc;text-shadow:0 2px 18px rgba(0,0,0,.6);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;padding-right:46px}
.oc-n{position:absolute;left:16px;top:32px;font:600 10px var(--f-mono,monospace);color:rgba(255,236,180,.5);letter-spacing:.1em}
.oc-pl{position:absolute;right:14px;bottom:14px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#f7d37a,#d9a53a);color:#1b1305;box-shadow:0 0 20px rgba(242,193,78,.5)}.oc-pl svg{width:16px;height:16px;margin-left:2px}
.oe-cov.c-ig{--cc:#ff6a3d;--c2:#e1306c}.oe-cov.c-tt{--cc:#25f4ee;--c2:#fe2c55}.oe-cov.c-sc{--cc:#fffc00;--c2:#c9a400}.oe-cov.c-x{--cc:#e7e9ea;--c2:#1d9bf0}.oe-cov.c-fb{--cc:#6d8cff;--c2:#3b5bdb}.oe-cov.c-yt{--cc:#ff3b3b;--c2:#a50000}
.oe-cov.urg{--cc:#ff5a3d;--c2:#f2c14e}.oe-cov.urg::before{border-color:rgba(255,110,80,.6);animation:ocUrg 1.8s ease-in-out infinite}.oe-cov.urg .oc-lab{color:#ff9b7a}@keyframes ocUrg{50%{border-color:rgba(255,200,120,.9);box-shadow:inset 0 0 24px rgba(255,90,60,.25)}}

/* ===== règles imposées ===== */
.oe-gate{margin:14px 0 6px;padding:18px;border-radius:20px;border:1px solid rgba(242,193,78,.5);background:linear-gradient(180deg,rgba(242,193,78,.12),rgba(8,7,5,.75));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 0 40px rgba(242,193,78,.12)}
.oe-gate h3{margin:0 0 4px;font:400 24px var(--f-display,Georgia,serif);color:#fff3cc}.oe-gate p{margin:0 0 12px;color:#c9bfa6;font-size:13.5px}
.oe-gate .gbtn2{all:unset;box-sizing:border-box;cursor:pointer;margin-top:14px;width:100%;text-align:center;padding:14px;border-radius:14px;font-weight:700;color:#1b1305;background:linear-gradient(180deg,#f7d37a,#d9a53a);box-shadow:0 10px 30px rgba(242,193,78,.3)}.oe-gate .gbtn2:hover{filter:brightness(1.06)}
.oe-gated{opacity:.38;pointer-events:none;filter:saturate(.6)}
.oe-rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px;align-items:start}
.oe-rc{border:1px solid rgba(242,193,78,.22);border-radius:16px;background:rgba(8,7,5,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:13px 15px;border-top:3px solid var(--rc,#f2c14e)}
.oe-rc.ig{--rc:#ff7a3d}.oe-rc.x{--rc:#1d9bf0}.oe-rc.tt{--rc:#ff2d6f}.oe-rc.sc{--rc:#ffd400}.oe-rc.fb{--rc:#7c5cff}.oe-rc.yt{--rc:#ff2b2b}
.oe-rc header{display:flex;align-items:center;gap:8px;margin-bottom:9px}.oe-rc header b{font-size:14.5px;color:#fff3cc}.oe-rc header small{margin-left:auto;color:#a59e8f;font-size:12px}
.oe-rc ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}.oe-rc li{position:relative;padding-left:20px;font-size:13.5px;color:#ebe4d2;line-height:1.45}.oe-rc li::before{content:"✦";position:absolute;left:2px;top:0;color:#f2c14e;font-size:11px}
.oe-alt{display:block;margin-top:6px;font-size:13px;color:#b9f0c6}

/* ===== gamification v2 : badges animés, flamme évolutive, XP ===== */
.oe-game{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1.25fr) minmax(110px,.55fr);gap:10px;margin-top:16px;align-items:stretch}
.oe-game>div{position:relative;overflow:hidden;border:1px solid rgba(242,193,78,.22);border-radius:18px;padding:12px 14px;background:linear-gradient(180deg,rgba(255,236,180,.06),rgba(0,0,0,.28));display:flex;align-items:center;gap:12px;min-width:0}
.oe-game b{display:block;font-size:14px;color:#fff3cc}.oe-game small{display:block;font-size:12px;color:#a59e8f;line-height:1.35}
.oe-emb{width:58px;height:58px;flex:none;filter:drop-shadow(0 0 14px rgba(242,193,78,.35))}.oe-emb svg{width:100%;height:100%}
.oe-lv>div{flex:1;min-width:0}.oe-bar{display:block;height:8px;border-radius:999px;background:rgba(255,255,255,.08);margin-top:8px;overflow:hidden}.oe-bar em{display:block;height:100%;min-width:6px;border-radius:inherit;background:linear-gradient(90deg,#b8862b,#f2c14e,#fff0c4);box-shadow:0 0 12px rgba(242,193,78,.6);position:relative;overflow:hidden;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.oe-bar em::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.7) 50%,transparent 70%);transform:translateX(-100%);animation:oeShine 2.6s ease-in-out infinite}@keyframes oeShine{60%,100%{transform:translateX(100%)}}
/* badges SVG */
.bsv{display:block;width:100%;height:100%;overflow:hidden;border-radius:50%}
.bsv .lf{transform-box:view-box}.bsv .lf-l{transform-origin:32px 36px;animation:lfL 3.2s ease-in-out infinite}.bsv .lf-r{transform-origin:32px 31px;animation:lfR 3.6s ease-in-out infinite}
@keyframes lfL{0%,100%{transform:rotate(0)}30%{transform:rotate(-9deg)}60%{transform:rotate(4deg)}}@keyframes lfR{0%,100%{transform:rotate(0)}35%{transform:rotate(8deg)}70%{transform:rotate(-4deg)}}
.bsv .spin{transform-box:view-box;transform-origin:32px 32px;animation:bSpin 16s linear infinite}.bsv .spin2{transform-box:view-box;transform-origin:32px 32px;animation:bSpin 9s linear infinite reverse}.bsv .spin3{transform-box:view-box;transform-origin:32px 32px;animation:bSpin 24s linear infinite}
.b-sunrise .spin{transform-origin:32px 34px;animation-duration:12s}
@keyframes bSpin{to{transform:rotate(360deg)}}
.bsv .tw{animation:bTw 2.2s ease-in-out infinite}.bsv .tw2{animation-delay:.7s}.bsv .tw3{animation-delay:1.4s}@keyframes bTw{0%,100%{opacity:.2}50%{opacity:1}}
.bsv .shine{animation:bShine 3.2s ease-in-out infinite}@keyframes bShine{0%,55%{transform:translateX(-30px) rotate(20deg)}85%,100%{transform:translateX(50px) rotate(20deg)}}
.bsv .glint{transform-box:fill-box;transform-origin:center;animation:bGl 2.4s ease-in-out infinite}@keyframes bGl{0%,100%{transform:scale(.2);opacity:0}50%{transform:scale(1.2);opacity:1}}
.bsv .cw{transform-box:view-box;transform-origin:32px 40px;animation:bCw 3s ease-in-out infinite}@keyframes bCw{50%{transform:translateY(-1.5px) scale(1.03)}}
.bsv .fl1{transform-box:view-box;transform-origin:32px 46px;animation:bFl 1.1s ease-in-out infinite alternate}.bsv .fl2{transform-box:view-box;transform-origin:32px 43px;animation:bFl 0.8s ease-in-out infinite alternate-reverse}@keyframes bFl{from{transform:scaleY(.94) skewX(-2deg)}to{transform:scaleY(1.06) skewX(2deg)}}
.bsv .zap{animation:bZap 2.4s ease-in-out infinite}@keyframes bZap{0%,80%,100%{opacity:1}85%{opacity:.4}90%{opacity:1}93%{opacity:.5}}
.bsv .rib{transform-box:view-box;transform-origin:32px 12px;animation:bRib 3s ease-in-out infinite}@keyframes bRib{50%{transform:rotate(4deg)}}
.bsv .sandT{transform-box:view-box;transform-origin:32px 30px;animation:bSandT 4s linear infinite}.bsv .sandB{transform-box:view-box;transform-origin:32px 48px;animation:bSandB 4s linear infinite}.bsv .drip{animation:bTw 1s linear infinite}
@keyframes bSandT{from{transform:scaleY(1)}to{transform:scaleY(.15)}}@keyframes bSandB{from{transform:scaleY(.15)}to{transform:scaleY(1)}}
.bsv .trail{animation:bTr 2s ease-in-out infinite}.bsv .head{animation:bTw 1.6s ease-in-out infinite}@keyframes bTr{50%{opacity:.9}}
.bsv .orb{transform-box:view-box;transform-origin:32px 32px;animation:bSpin 5s linear infinite}.bsv .orb2{animation-duration:8s;animation-direction:reverse}
.oe-bd{grid-column:1/-1;gap:8px!important;flex-wrap:wrap;padding:10px 12px!important}
.oe-bdg{width:44px;height:44px;flex:none;border-radius:50%;cursor:help;transition:transform .25s,filter .3s;filter:grayscale(1) brightness(.55)}.oe-bdg:hover{transform:translateY(-2px) scale(1.08)}
.oe-bdg.on{filter:drop-shadow(0 0 8px rgba(242,193,78,.45))}.oe-bdg:not(.on) svg *{animation:none!important}
/* flamme évolutive */
.oe-fl{--fs:.8;width:52px;height:60px;flex:none;display:grid;place-items:end center;filter:grayscale(1) opacity(.45)}.oe-fl svg{width:calc(52px*var(--fs));height:calc(60px*var(--fs));overflow:visible}
.oe-fl.on{filter:drop-shadow(0 0 calc(4px + var(--fs)*8px) rgba(255,140,40,.7))}
.oe-fl.on .f1{transform-box:view-box;transform-origin:40px 90px;animation:flA 1.3s ease-in-out infinite alternate}.oe-fl.on .f2{transform-box:view-box;transform-origin:40px 88px;animation:flB .9s ease-in-out infinite alternate}.oe-fl.on .f3{transform-box:view-box;transform-origin:40px 86px;animation:flC .7s ease-in-out infinite alternate}
@keyframes flA{0%{transform:scale(1,1) skewX(-3deg)}100%{transform:scale(1.04,1.08) skewX(3deg)}}@keyframes flB{0%{transform:scale(1.02,.96) skewX(3deg)}100%{transform:scale(.97,1.07) skewX(-3deg)}}@keyframes flC{0%{transform:scale(1,.92)}100%{transform:scale(.95,1.1)}}
.oe-fl .spk circle{animation:flS 1.8s ease-out infinite}.oe-fl .spk circle:nth-child(2){animation-delay:.5s}.oe-fl .spk circle:nth-child(3){animation-delay:.9s}.oe-fl .spk circle:nth-child(4){animation-delay:1.3s}
@keyframes flS{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
.oe-fl .fl-ring{transform-box:view-box;transform-origin:40px 62px;animation:bSpin 10s linear infinite}.oe-fl .fl-ring.r2{animation-duration:16s;animation-direction:reverse}
.oe-fl .fl-cr{transform-box:view-box;transform-origin:40px 10px;animation:bCw 2.4s ease-in-out infinite}

async function fetchFile(id, set, upto){ const r=await fetch(`${SB_URL}/functions/v1/va-drive`,{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+SB_KEY},body:JSON.stringify({t:K,op:'get',id})});
  if(!r.ok){ let e=''; try{ e=(await r.json()).err; }catch(_){ } throw new Error(e||'Téléchargement impossible.'); }
  const len=+r.headers.get('content-length')||0, rd=r.body.getReader(), parts=[]; let got=0;
  for(;;){ const {done,value}=await rd.read(); if(done) break; parts.push(value); got+=value.length; set(null, len?got/len*upto:Math.min(upto*.95,got/4e7*upto), (got/1048576).toFixed(1).replace('.',',')+' Mo reçus'); }
  let fn=''; try{ fn=decodeURIComponent(r.headers.get('x-file-name')||''); }catch(_){ } return {blob:new Blob(parts,{type:r.headers.get('content-type')||'application/octet-stream'}), name:fn}; }

function saveFiles(files, ov, set, done){ const canShare=navigator.canShare && navigator.canShare({files}) && /iphone|ipad|android/i.test(navigator.userAgent);

const mimeOk=()=>{ const L=['video/mp4;codecs=avc1.640028,mp4a.40.2','video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm']; for(const m of L){ try{ if(window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m; }catch(_){ } } return ''; };

async function vdSpoof(f, card){ if(!f || VD.job) return; const mime=mimeOk(); if(!mime || !HTMLCanvasElement.prototype.captureStream){ toast('Ton navigateur ne peut pas créer les versions. Utilise Chrome ou Safari à jour.'); return; }

    vid.src=url; await new Promise((ok,ko)=>{ vid.onloadedmetadata=ok; vid.onerror=()=>ko(new Error('lecture')); });
    let W=vid.videoWidth, H=vid.videoHeight; const sc=Math.min(1,1920/Math.max(W,H)); W=Math.round(W*sc/2)*2; H=Math.round(H*sc/2)*2; const dur=vid.duration||1;
    let aTrack=null, aSrc=null; try{ ac=new (window.AudioContext||window.webkitAudioContext)(); const buf=await ac.decodeAudioData(await src.arrayBuffer()); const dst=ac.createMediaStreamDestination(); aSrc=ac.createBufferSource(); aSrc.buffer=buf; aSrc.connect(dst); aTrack=dst.stream.getAudioTracks()[0]; }catch(_){ aTrack=null; }
    const V=SPOOF.map(v=>{ const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d'); x.filter=v.f; const tr=[...c.captureStream(30).getVideoTracks()]; if(aTrack) tr.push(aTrack.clone()); const rec=new MediaRecorder(new MediaStream(tr),{mimeType:mime, videoBitsPerSecond:12e6, audioBitsPerSecond:192000}); const ch=[]; rec.ondataavailable=e=>{ if(e.data&&e.data.size) ch.push(e.data); }; return {x,rec,ch}; });
    set('Création des 3 versions…', .35, 'Couleurs ajustées : version 1, 2 et 3 en même temps');
    const draw=()=>V.forEach(o=>o.x.drawImage(vid,0,0,W,H));
    const loop=()=>{ draw(); set(null,.35+.6*Math.min(1,vid.currentTime/dur)); if(!vid.ended && VD.job) (vid.requestVideoFrameCallback?vid.requestVideoFrameCallback(loop):requestAnimationFrame(loop)); };
    V.forEach(o=>o.rec.start(1000)); if(ac && ac.state==='suspended') try{ await ac.resume(); }catch(_){ }
    vid.currentTime=0; draw(); await vid.play(); if(aSrc) aSrc.start(0, vid.currentTime); loop();
    await new Promise(ok=>{ vid.onended=ok; }); draw(); await new Promise(ok=>setTimeout(ok,250));
    const blobs=await Promise.all(V.map(o=>new Promise(ok=>{ o.rec.onstop=()=>ok(new Blob(o.ch)); o.rec.stop(); })));
    try{ aSrc&&aSrc.stop(); }catch(_){ } URL.revokeObjectURL(url); try{ ac&&ac.close(); }catch(_){ }
    const head=new Uint8Array(await blobs[0].slice(0,12).arrayBuffer()), mp4=String.fromCharCode(...head.slice(4,8))==='ftyp', ext=mp4?'mp4':'webm';
    const files=blobs.map((b,i)=>new File([b],`version ${i+1}.${ext}`,{type:mp4?'video/mp4':'video/webm'}));
    ov.querySelectorAll('.vd-v3 span').forEach(e=>e.classList.add('ok')); set('✅ Tes 3 versions sont prêtes', 1, '');
    saveFiles(files, ov, set, ()=>{ VD.job=false; ov.remove(); vdUsed('video', f, card); });
  }catch(e){ try{ ac&&ac.close(); }catch(_){ } fail(e && e.message==='lecture'?'Ce format de vidéo ne peut pas être lu sur ce téléphone.':(e&&e.message&&e.message.length>20?e.message:'Échec, réessaie.')); } }

  const setV=(el,t,v,run)=>{ const r=Math.round(v), prev=el.__r;
    if(t==='ring'){ el.style.setProperty('--p',v.toFixed(2)); const b=el.querySelector('b'); if(b) b.textContent=r+'%'; const o=el.classList.contains('ring')?-90:0; head(el).style.transform=`rotate(${o+v*3.6}deg)`; }
    else if(t==='bar') el.style.width=v.toFixed(2)+'%';
    else el.textContent=r.toLocaleString('fr-FR');
    if(run && t!=='bar' && prev!=null && r!==prev){ const tg=t==='ring'?el.querySelector('b'):el; if(tg){ tg.classList.remove('tw-tick'); void tg.offsetWidth; tg.classList.add('tw-tick'); } if(t==='ring' && r>prev) headSpark(el,v); }
    el.__r=r; };
  const headSpark=(el,v)=>{ const r=el.getBoundingClientRect(); if(!r.width) return; const o=el.classList.contains('ring')?-90:0, a=(o+v*3.6-90)*Math.PI/180, R2=r.width/2-5, cx=r.left+r.width/2+Math.cos(a)*R2, cy=r.top+r.height/2+Math.sin(a)*R2;
    for(let i=0;i<3;i++){ const d=document.createElement('i'); d.className='tw-spk sm'; const b=Math.random()*Math.PI*2, m=10+Math.random()*16; d.style.left=cx+'px'; d.style.top=cy+'px'; d.style.setProperty('--dx',Math.cos(b)*m+'px'); d.style.setProperty('--dy',Math.sin(b)*m+'px'); document.body.appendChild(d); setTimeout(()=>d.remove(),950); } };
  const gain=(el,txt)=>{ const r=el.getBoundingClientRect(); if(!r.width) return; const g=document.createElement('b'); g.className='tw-gain'; g.textContent=txt; g.style.left=(r.left+r.width/2)+'px'; g.style.top=(r.top)+'px'; document.body.appendChild(g); setTimeout(()=>g.remove(),2600); };
  const sparks=(el,n)=>{ const r=el.getBoundingClientRect(); if(!r.width) return; for(let i=0;i<(n||12);i++){ const d=document.createElement('i'); d.className='tw-spk'; const a=Math.random()*Math.PI*2, m=26+Math.random()*34; d.style.left=(r.left+r.width/2)+'px'; d.style.top=(r.top+r.height/2)+'px'; d.style.setProperty('--dx',Math.cos(a)*m+'px'); d.style.setProperty('--dy',Math.sin(a)*m+'px'); document.body.appendChild(d); setTimeout(()=>d.remove(),950); } };
  const durOf=(t,d)=>t==='ring'?Math.max(3500,Math.min(8000,d*380)):t==='num'?Math.max(3000,Math.min(7000,d*300)):Math.max(3500,Math.min(6000,2800+d*50));
  function run(el){ const t=el.dataset.tw, k=t+':'+el.dataset.k, to=parseFloat(el.dataset.v)||0, lv=el.dataset.lv;
    const old=P.get(k);
    // même cible déjà en cours d'animation (la page s'est redessinée) : on continue sur le nouvel élément, sans recommencer
    if(old && old.active && Math.abs(old.to-to)<.01){ old.el=el; setV(el,t,old.cur); if(t==='ring'||t==='bar') (t==='bar'?el.parentElement:el).classList.add('tw-run'); return; }
    let from=old?old.cur:(k in ss?ss[k]:0); const wrap=t==='bar' && old && lv!=null && old.lv!=null && +lv>+old.lv;
    if(old){ cancelAnimationFrame(old.raf); clearTimeout(old.tm); }
    const st={cur:from,to,lv,raf:0,tm:0,el,active:true}; P.set(k,st); ss[k]=to; try{ sessionStorage.setItem('oe_tw',JSON.stringify(ss)); }catch(_){ }
    setV(el,t,from); if(RM || (!wrap && Math.abs(to-from)<.01)){ st.cur=to; st.active=false; setV(el,t,to); return; }
    const up=wrap||to>from, H=()=>t==='bar'?st.el.parentElement:st.el, TD=()=>k==='num:xpd'?st.el.closest('.oe-td'):null;
    const segs=wrap?[[from,100],[0,to]]:[[from,to]]; let si=0;
    const end=()=>{ st.cur=to; st.active=false; const el=st.el, host=H(), td=TD(); setV(el,t,to,true); host.classList.remove('tw-run'); if(td) td.classList.remove('tw-run');
      if(up && old){ host.classList.remove('tw-up'); void host.offsetWidth; host.classList.add('tw-up'); setTimeout(()=>host.classList.remove('tw-up'),1200); if(t==='ring') sparks(el,14); if(td) sparks(td,12); } };
    const go=()=>{ const [a,b]=segs[si], dur=durOf(t,Math.abs(b-a)), t0=performance.now();
      if(si===0 && up && old){ if(t==='ring') gain(st.el,'+'+Math.round(to-from)+' %'); else if(k==='num:xpd'){ const td=TD(); gain(td||st.el,'+'+Math.round(to-from)+' XP'); } }
      const step=now=>{ const x=Math.min(1,(now-t0)/dur), v=a+(b-a)*ease(x); st.cur=v; H().classList.add('tw-run'); const td=TD(); if(td) td.classList.add('tw-run'); setV(st.el,t,v,true); if(x<1) st.raf=requestAnimationFrame(step); else if(++si<segs.length){ setV(st.el,t,0); st.raf=requestAnimationFrame(()=>go()); } else end(); };
      st.raf=requestAnimationFrame(step); };
    // si une célébration (badge / niveau) est affichée, on attend qu'elle se ferme pour qu'on voie la montée
    const start=()=>{ if(document.querySelector('.oe-lvl')){ st.tm=setTimeout(start,150); return; } go(); };
    st.tm=setTimeout(start, old?60:350); }
  const scan=()=>document.querySelectorAll('[data-tw]').forEach(el=>{ if(seen.has(el)) return; seen.add(el); run(el); });
  window.OE_twSet=(el,t,k,v)=>{ el.dataset.tw=t; el.dataset.k=k; el.dataset.v=v; seen.add(el); run(el); };
  new MutationObserver(scan).observe(document.documentElement,{childList:true,subtree:true}); document.addEventListener('DOMContentLoaded',scan);
})();
</script>
