  /* ============ écran : suivi ============ */
  /* Progression des charges : pour chaque exercice noté, la charge du moment, le gain depuis la première fois et la courbe */
  const kgf = v => (Math.round(v * 2) / 2).toLocaleString('fr-FR');
  function loads() {
    const rows = [];
    Object.keys(S.w).forEach(function (id) {
      const w = S.w[id], ex = exo(id), h = (w && w.h) || [];
      if (ex && h.length) rows.push({ id, n: ex.n, h, last: h[h.length - 1], first: h[0] });
    });
    return rows.sort((a, b) => a.last[0] < b.last[0] ? 1 : a.last[0] > b.last[0] ? -1 : a.n < b.n ? -1 : 1);
  }
  function spark(h) {
    const W = 104, H = 30, vs = h.map(e => e[1]), mn = Math.min.apply(null, vs), mx = Math.max.apply(null, vs), n = vs.length;
    if (n < 2) return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true"><path d="M4 ' + (H - 9) + 'H' + (W - 12) + '" stroke="#33292b" stroke-width="2" stroke-dasharray="3 5" fill="none"/><circle cx="' + (W - 6) + '" cy="' + (H - 9) + '" r="3.4" fill="#ff2a3c"/></svg>';
    const X = i => 4 + i / (n - 1) * (W - 10), Y = v => H - 6 - (mx > mn ? (v - mn) / (mx - mn) : .5) * (H - 12);
    const d = vs.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join('');
    return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true"><path d="' + d + 'V' + H + 'H4Z" fill="rgba(255,42,60,.14)"/><path d="' + d + '" fill="none" stroke="#ff2a3c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="' + X(n - 1).toFixed(1) + '" cy="' + Y(vs[n - 1]).toFixed(1) + '" r="3.2" fill="#ff2a3c"/></svg>';
  }
  function loadsCard() {

    }).join('') + (rows.length > max ? '<button class="btn btn-ghost loads-more" data-a="loadsall">' + (ui.allLoads ? 'Réduire' : 'Voir les ' + (rows.length - max) + ' autres') + '</button>' : '') + '</section>';
  }
  function chart(ws) {
    const W = 320, H = 120, x0 = 6, x1 = W - 8, y0 = 14, y1 = H - 20;
    if (ws.length < 2) return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true"><path d="M' + x0 + ' ' + (y1 - 20) + 'H' + x1 + '" stroke="#33292b" stroke-width="2" stroke-dasharray="4 6"/><circle cx="' + x0 + '" cy="' + (y1 - 20) + '" r="5" fill="#ff2a3c"/></svg>';

    const vmin = Math.min.apply(null, vs) - .6, vmax = Math.max.apply(null, vs) + .6;
    const X = t => x0 + (t - tmin) / ((tmax - tmin) || 1) * (x1 - x0), Y = v => y1 - (v - vmin) / (vmax - vmin) * (y1 - y0);

      if (name.length < 2) { toast('Écris d’abord le nom de ta machine ou de ton exercice.'); return; }
      if (Object.keys(S.g.c).length >= 30) { toast('30 exercices personnels, c’est le maximum.'); return; }
      const id = 'u' + (++S.g.i), ex = edEntries(p.w);
      S.g.c[id] = { n: name, g, s: 3, r: '10 à 12', t: 90 };
      if (ex.length < 14) ex.splice(insertAt(ex, g), 0, { id });
      p.nn = '';
      edCommit('« ' + name + ' » ajouté à la séance du ' + JOURS[p.w] + '.');
    },
    edrm: function (el) {
      edSnap();
      const id = el.dataset.id, c = S.g.c[id];
      if (!c) return;
      delete S.g.c[id];
      for (let w = 0; w < 7; w++) { const d = S.g.d[w]; if (d && d.ex) { d.ex = d.ex.filter(e => e.id !== id); if (!d.ex.length) delete S.g.d[w]; } }
      edCommit('« ' + c.n + ' » supprimé.');
    },
    edrest: function () { edSnap(); const w = edTop().p.w; if (PLAN[w]) S.g.d[w] = 0; else delete S.g.d[w]; edCommit(cap(JOURS[w]) + ' : jour de repos.'); },
    edreset: function () { edSnap(); delete S.g.d[edTop().p.w]; edCommit('Séance d’origine remise.'); },
    edresetall: function () { edKeep(); const p = edTop().p; if (!p.cf) { p.cf = 1; renderTop(); return; } edSnap(); p.cf = 0; S.g.d = {}; edCommit('Semaine d’origine remise.'); },
    exo: el => openSheet('exo', { id: el.dataset.id, d: el.dataset.d }),
    recipe: el => openSheet('recipe', { d: el.dataset.d, s: el.dataset.s }),
    product: el => openSheet('product', { id: el.dataset.id, fromList: tab === 'courses' && !sheets.length }),
    full: () => { sheets[sheets.length - 1].p.full = 1; renderTop(); },
    step: (el, e) => { if (!e.target.closest('.tchip')) el.classList.toggle('done'); },
    timer: el => startTimer(+el.dataset.sec, el.dataset.l || 'Minuteur'),
    'timer-stop': () => { timer = null; tickTimer(); },
    eat: function (el) {
      const k = el.dataset.d, s = el.dataset.s, o = day(k, 1); o.m = o.m || {};
      if (o.m[s]) delete o.m[s]; else o.m[s] = 1;
      touch(docOfDay(k)); render(true);
      if (o.m[s]) {
        tap(); pop('#view .chk[data-a="eat"][data-d="' + k + '"][data-s="' + s + '"]'); pop('#sheets .sheet:last-child .sheet-cta [data-a="eat"]');
        if (Object.keys(o.m).length === 4) toast('Les 4 repas sont pris. Journée complète.');
      }
    },
    eau: function (el) { const k = E.dkey(E.today()), o = day(k, 1), n = +el.dataset.i + 1; o.eau = o.eau === n ? n - 1 : n; touch(docOfDay(k)); render(true); if (o.eau === n) { tap(); pop('#view .dropb[data-i="' + (n - 1) + '"]'); if (n === 6) toast('3 litres bus. Bien joué.'); } },
    mealday: el => { ui.mealDay = el.dataset.d; render(true); },
    mealwk: el => { ui.mealWk = clamp(ui.mealWk + (+el.dataset.v), -4, 8); ui.mealDay = null; render(true); },
    gymwk: el => { ui.gymWk = clamp(ui.gymWk + (+el.dataset.v), -12, 8); render(true); },
    cal: el => { ui.calOff = clamp(ui.calOff + (+el.dataset.v), -12, 6); render(true); },
    listmode: el => { ui.listMode = el.dataset.v; render(true); },
    check: function (el) {
      const id = el.dataset.id, pr = PRODUCTS[id];
      if (pr.ray === 'pl') { if (S.pl[id]) delete S.pl[id]; else S.pl[id] = 1; touch('reglages'); }
      else {
        const key = ui.spec.key, st = S.c[key] = S.c[key] || {}, to = +(el.dataset.to || 1), cur = st[id] || 0;
        if (el.dataset.to ? cur === to : cur) delete st[id]; else st[id] = to;
        Object.keys(S.c).sort().slice(0, -6).forEach(k => { delete S.c[k]; });      // on garde 6 semaines
        touch('courses');
      }
      const was = ui.list ? ui.list.got : 0;
      if (tab === 'courses' && patchList(id)) { if (sheets.length) renderTop(); } else render(true);
      const on = pr.ray === 'pl' ? S.pl[id] : (S.c[ui.spec.key] || {})[id];
      if (on) { tap(); pop('#view .chk[data-a="check"][data-id="' + id + '"]'); pop('#sheets .sheet:last-child .sheet-cta [data-id="' + id + '"][aria-pressed="true"]'); }
      if (on && pr.ray !== 'pl' && ui.list && ui.list.got === ui.list.n && was < ui.list.n) toast('Liste complète : tout est dans le panier.');
    },
    done: function (el) {
      const k = el.dataset.d, o = day(k, 1);
      if (o.s) delete o.s; else o.s = 1;
      touch(docOfDay(k)); render(true);
      if (o.s) {
        const n = totalSessions(), rk = rank(n), up = rk.cur[0] === n && n > 0, left = rk.next ? rk.next[0] - n : 0;
        celebrate(up ? rk.cur[1] : 'Séance validée', up ? 'Nouveau rang débloqué : ' + rk.cur[2] + '.' : rk.next ? 'Encore ' + left + ' séance' + (left > 1 ? 's' : '') + ' avant le rang ' + rk.next[1] + '.' : 'Tu es au sommet. Géant.');
      }
    },
    set: function (el) {
      const id = el.dataset.id, k = el.dataset.d, o = day(k, 1), se = sessAt(E.parseKey(k)), ex = cfgOf((se && se.ex.find(e => e.id === id)) || { id }), n = +el.dataset.i + 1;
      o.x = o.x || {};
      const cur = o.x[id] || 0, nv = cur === n ? n - 1 : n;
      if (nv) o.x[id] = nv; else delete o.x[id];
      touch(docOfDay(k));
      if (nv > cur) {
        const w = S.w[id];
        if (w && w.kg) { w.h = w.h || []; const last = w.h[w.h.length - 1]; if (last && last[0] === k) last[1] = w.kg; else w.h.push([k, w.kg]); w.h = w.h.slice(-20); touch('charges'); }
        if (nv < ex.sets) startTimer(ex.rest, 'Repos'); else toast('Exercice terminé. Passe au suivant.');
      }
      renderTop();
      if (nv > cur) { tap(); pop('#sheets .sheet:last-child .setb[data-i="' + (nv - 1) + '"]'); }
    },
    kg: function (el) {
      const id = el.dataset.id, w = S.w[id] = S.w[id] || {}, v = +el.dataset.v;
      w.kg = w.kg ? Math.max(0, Math.round((w.kg + v) * 2) / 2) : (v > 0 ? 20 : 0);
      if (!w.kg) delete w.kg;
      touch('charges'); renderTop();
    },
    kcal: function (el) { S.set.kadj = clamp((S.set.kadj || 0) + (+el.dataset.v), -600, 900); touch('reglages'); applyProfile(); render(true); toast('Portions et liste de courses recalculées.'); },
    addw: function () {
      const el = $('#w-new'), v = parseFloat(String(el.value).replace(',', '.'));
      if (!(v > 35 && v < 200)) { toast('Entre ton poids en kilos, par exemple 65,4.'); return; }
      S.p[E.dkey(E.today())] = Math.round(v * 10) / 10; touch('poids'); render(true); toast('Pesée enregistrée.');
    },
    reset: function () {
      if (!ui.reset) { ui.reset = 1; render(true); return; }
      const names = ['reglages', 'courses', 'charges', 'poids'].concat(Object.keys(T).filter(n => n.indexOf('jour-') === 0));
      const g = S.g;                                                              // les séances qu'il a composées ne sont pas du suivi : on les garde
      const keep = S.set; S = DEF(); S.g = g; S.set = Object.assign(keep, { start: E.dkey(E.today()), kadj: 0 }); ui.reset = 0; applyProfile();   // son profil et ses allergies restent
      names.forEach(touch); render(); toast('Suivi remis à zéro.');
    }
  };

  /* ============ démarrage ============ */
  function start(snap) {
    loadLocal();
    if (!S.set.start) { S.set.start = E.dkey(E.today()); saveLocal(); }
    applyProfile();
    const h = (location.hash || '').slice(1);
    if (TABS.some(x => x[0] === h)) tab = h; else if (snap && snap.tab) tab = snap.tab;
    RIG.setGate(el => !!el.closest('.fx') || !sheets.length || !!el.closest('.sheet:last-child'));
    const app = $('#app');
    let drag = null, dragEnd = 0;
    app.addEventListener('pointerdown', function (e) {
      const barEl = e.target.closest('.sheet-bar');
      if (!barEl || closing || barEl.parentNode !== $('#sheets').lastElementChild) return;
      drag = { y: e.clientY, el: barEl.parentNode, dy: 0, id: e.pointerId };
    });
    app.addEventListener('pointermove', function (e) {
      if (!drag || e.pointerId !== drag.id) return;
      drag.dy = Math.max(0, e.clientY - drag.y);
      if (drag.dy > 6) { drag.el.style.transition = 'none'; drag.el.style.transform = 'translateY(' + drag.dy + 'px)'; }
    });
    const endDrag = function () {
      if (!drag) return;
      const d = drag; drag = null;
      d.el.style.transition = ''; d.el.style.transform = '';
      if (d.dy > 6) dragEnd = Date.now();
      if (d.dy > 110) closeSheet();
    };
    app.addEventListener('pointerup', endDrag); app.addEventListener('pointercancel', endDrag);
    app.addEventListener('click', function (e) {
      if (Date.now() - dragEnd < 350) return;                    // fin d'un glissement : ce n'est pas une touche
      const el = e.target.closest('[data-a]');
      if (!el || !app.contains(el)) return;
      const f = ACT[el.dataset.a]; if (f) f(el, e);
    });
    app.addEventListener('change', function (e) {
      const gk = e.target.dataset && e.target.dataset.g, top = edTop();
      if (e.target.id === 'ed-ng' && top && top.kind === 'edit') { top.p.ng = e.target.value; return; }   // partie du corps choisie pour sa propre machine
      if (gk && top && top.kind === 'edit') {                       // composer ses séances : répétitions d'un exercice, nom de la séance
        edSnap();
        const w = top.p.w;
        if (gk === 'reps') { const en = edEntries(w)[+e.target.dataset.i]; if (!en) return; const v = cleanReps(e.target.value); if (!v || v === exo(en.id).reps) delete en.r; else en.r = v; }
        else if (gk === 'name') { const v = String(e.target.value).trim().replace(/\s+/g, ' ').slice(0, 22); edEntries(w); if (v) S.g.d[w].n = v; else delete S.g.d[w].n; }
        edCommit('', gk === 'name' ? 'keep' : '');
        return;
      }
      const f = e.target.dataset && e.target.dataset.f; if (!f) return;
      if (f === 'name') S.set.name = String(e.target.value).trim().slice(0, 24);
      else { const v = parseFloat(String(e.target.value).replace(',', '.')); if (!(v > 0)) { rerender(); return; } const L = { goal: [35, 180], budget: [20, 400], h: [130, 230], w0: [35, 200] }[f] || [0, 1e4]; S.set[f] = clamp(v, L[0], L[1]); }
      touch('reglages'); applyProfile(); rerender();
    });
    window.addEventListener('hashchange', function () { const x = (location.hash || '').slice(1); if (x !== tab && TABS.some(y => y[0] === x)) { tab = x; sheets.length = 0; render(); } });
    const newDay = function () {
      if (lastDay === E.dkey(E.today())) return;
      ui.mealDay = null; ui.mealWk = 0; ui.listMode = null; ui.gymWk = 0; ui.calOff = 0;   // on repart sur aujourd'hui
      render();
    };
    document.addEventListener('visibilitychange', function () { if (!document.hidden) newDay(); });
    setInterval(newDay, 60000);
    document.body.insertAdjacentHTML('afterbegin', RIG.defs + ART.defs);
    /* La lueur suit la répétition : montée pendant l'effort, lente retombée pendant le retour */
    const P = RIG.PERIOD, pc = x => (x / P * 100).toFixed(1) + '%', lo = '{opacity:.28;transform:scale(.92)}', hi = '{opacity:1;transform:scale(1.07)}';
    const st = document.createElement('style');
    st.textContent = '@keyframes rep{0%' + lo + pc(RIG.UP) + hi + pc(RIG.UP + RIG.H1) + hi + pc(RIG.UP + RIG.H1 + RIG.DN) + lo + '100%' + lo + '}.rep{animation:rep ' + P + 'ms linear infinite}';
    document.head.appendChild(st);
    /* Ouverture : tant que l'écran de démarrage est là, on retient les animations de l'accueil */
    const splash = $('#splash');
    if (splash && getComputedStyle(splash).display !== 'none') {
      intro = 1250; app.classList.add('splashing');
      setTimeout(function () { splash.remove(); app.classList.remove('splashing'); }, 1950);
    } else if (splash) splash.remove();
    $('#timer').lastElementChild.innerHTML = ICON.x;
    render();
    try { if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitHero); } catch (e) { /* facultatif */ }
    window.addEventListener('resize', fitHero);
    initCloud();
    try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ tab })); } catch (e) { /* facultatif */ }
  }
  if (window.claude && window.claude.hot && typeof window.claude.hot.ready === 'function') window.claude.hot.ready(start);
  else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();

</script>
</body>
